apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ template "ita-api-mcp-server.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ita-api-mcp-server.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "ita-api-mcp-server.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "ita-api-mcp-server.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      initContainers:
        - name: database-alive-check
          securityContext:
            {{- toYaml .Values.initContainers.database.securityContext | nindent 12 }}
          image: "{{ .Values.initContainers.database.image.repository }}:{{ .Values.initContainers.database.image.tag | default "latest" }}"
          imagePullPolicy: {{ .Values.initContainers.database.image.pullPolicy }}
          command: ["sh", "-c"]
          args:
            - |
              {{- .Values.initContainers.database.databaseCheck | nindent 14 }}
          env:
            {{- range $define := .Values.global -}}
            {{-   range $config, $value := $define.config }}
            {{-     if or (eq $define.name "ita-global") (eq $define.name "ita-database") }}
            - name: {{ $config }}
              valueFrom:
                configMapKeyRef:
                  name: ita-params-{{ $define.name }}
                  key: {{ $config }}
            {{-     end -}}
            {{-   end -}}
            {{-   range $secret, $value := $define.secret }}
            {{-     if or (eq $define.name "ita-database") }}
            - name: {{ $secret }}
              valueFrom:
                secretKeyRef:
                  name: ita-secret-{{ $define.name }}
                  key: {{ $secret }}
            {{-     end }}
            {{-   end }}
            {{- end }}
      containers:
        - name: {{ template "ita-api-mcp-server.name" . }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ template "ita-api-mcp-server.repository" . }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            {{- range $define := .Values.global -}}
            {{-   range $config, $value := $define.config }}
            {{-     if or (eq $define.name "ita-global") (eq $define.name "ita-database") }}
            - name: {{ $config }}
              valueFrom:
                configMapKeyRef:
                  name: ita-params-{{ $define.name }}
                  key: {{ $config }}
            {{-     end -}}
            {{-   end -}}
            {{-   range $secret, $value := $define.secret }}
            {{-     if or (eq $define.name "ita-global") (eq $define.name "ita-database") }}
            - name: {{ $secret }}
              valueFrom:
                secretKeyRef:
                  name: ita-secret-{{ $define.name }}
                  key: {{ $secret }}
            {{-     end }}
            {{-   end }}
            {{- end -}}
            {{ range $config, $value := .Values.extraEnv }}
            - name: {{ $config }}
              valueFrom:
                configMapKeyRef:
                  name: params-{{ template "ita-api-mcp-server.name" $ }}
                  key: {{ $config }}
            {{- end }}
          volumeMounts:
            - name: volume-{{ template "ita-api-mcp-server.name" . }}-homedir
              mountPath: {{ .Values.persistence.mountPath.homeDir }}
            - name: volume-{{ template "ita-api-mcp-server.name" . }}-pid
              mountPath: {{ .Values.persistence.mountPath.pid.path }}
              subPath: {{ .Values.persistence.mountPath.pid.subPath }}
            - name: volume-{{ template "ita-api-mcp-server.name" . }}-socket
              mountPath: {{ .Values.persistence.mountPath.socket.path }}
              subPath: {{ .Values.persistence.mountPath.socket.subPath }}
            - name: volume-{{ template "ita-api-mcp-server.name" . }}-tmp
              mountPath: {{ .Values.persistence.mountPath.tmp }}
          ports:
            - name: port-http
              containerPort: {{ .Values.extraEnv.LISTEN_PORT }}
              protocol: TCP
          startupProbe:
            {{- toYaml .Values.startupProbe | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: volume-{{ template "ita-api-mcp-server.name" . }}-homedir
          emptyDir: {}
        - name: volume-{{ template "ita-api-mcp-server.name" . }}-pid
          emptyDir: {}
        - name: volume-{{ template "ita-api-mcp-server.name" . }}-socket
          emptyDir: {}
        - name: volume-{{ template "ita-api-mcp-server.name" . }}-tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
